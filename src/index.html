<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots social media app" />
    <meta name="author" content="Emily Kelso" />
    <meta
      name="keywords"
      content="Bessie Coleman, social media profile, photos"
    />
    <title>Bessie Coleman | Spots</title>
    <link rel="shortcut icon" href="./favicon.ico" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/logo.svg')%>"
          alt="Spot logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__width">
          <div class="profile__avatar-container">
            <button class="profile__avatar-button">
              <img
                src="<%=require('./images/avatar-profile-icon.svg')%>"
                alt="Edit avatar icon"
                class="profile__avatar-icon"
              />
            </button>
            <img
              src="<%=require('./images/avatar.jpg')%>"
              alt="Bessie Coleman"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-button">
              <img
                src="<%=require('./images/edit-icon.svg')%>"
                alt="Edit icon"
                class="profile__edit-button-icon"
              />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__post-button">
            <img
              src="<%=require('./images/add-post-icon.svg')%>"
              alt="New post icon"
              class="profile__post-button-icon"
            />New Post
          </button>
        </section>
        <section class="cards page__width">
          <ul role="list" class="cards__list">
            <template id="card-template">
              <li role="listitem" class="card">
                <div class="card__image-container">
                  <img src="" alt="" class="card__image" />
                  <button type="button" class="card__delete-button"></button>
                </div>
                <div class="card__contents">
                  <h2 class="card__label"></h2>
                  <button type="button" class="card__like-button"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2024 © Spots</p>
      </footer>
      <div
        id="edit-modal"
        class="modal"
        role="dialog"
        aria-labelledby="edit-modal-title"
      >
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img
              src="<%=require('./images/modal-close-icon.svg')%>"
              alt="Close modal"
              class="modal__close-button-icon"
            />
          </button>
          <h2 id="edit-modal-title" class="modal__title">Edit profile</h2>
          <form id="profile-form" class="modal__form" novalidate>
            <label for="name" class="modal__label">
              Name
              <input
                type="text"
                id="name"
                name="name"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
                required
              />
              <span id="name-error" class="modal__error"></span>
            </label>
            <label for="description" class="modal__label">
              Description
              <input
                type="text"
                id="description"
                name="description"
                class="modal__input"
                placeholder="Describe yourself"
                minlength="2"
                maxlength="200"
                required
              />
              <span id="description-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>

      <div
        id="new-post-modal"
        class="modal"
        role="dialog"
        aria-labelledby="new-post-modal-title"
      >
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img
              src="<%=require('./images/modal-close-icon.svg')%>"
              alt="Close modal"
              class="modal__close-button-icon"
            />
          </button>
          <h2 id="new-post-modal-title" class="modal__title">New post</h2>
          <form id="new-post-form" class="modal__form" novalidate>
            <label for="image-link" class="modal__label">
              Image link
              <input
                type="url"
                id="image-link"
                name="image-link"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="image-link-error" class="modal__error"></span>
            </label>
            <label for="caption" class="modal__label">
              Caption
              <input
                type="text"
                id="caption"
                name="caption"
                class="modal__input"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
                required
              />
              <span id="caption-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>

      <div
        id="preview-modal"
        class="modal"
        role="dialog"
        aria-label="image preview"
      >
        <div class="modal__container modal__container_preview">
          <img src="" alt="" class="modal__image" />
          <button
            type="button"
            class="modal__close-button modal__close-button_preview"
          >
            <img
              src="<%=require('./images/preview-modal-close-icon.svg')%>"
              alt="Close image preview"
              class="modal__close-button-icon"
            />
          </button>
          <p class="modal__caption"></p>
        </div>
      </div>

      <div
        id="avatar-modal"
        class="modal"
        role="dialog"
        aria-labelledby="edit-avatar-title"
      >
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img
              src="<%=require('./images/modal-close-icon.svg')%>"
              alt="Close modal"
              class="modal__close-button-icon"
            />
          </button>
          <h2 id="edit-avatar-title" class="modal__title">
            Edit profile avatar
          </h2>
          <form id="avatar-form" class="modal__form" novalidate>
            <label for="avatar-link" class="modal__label">
              Profile Picture
              <input
                type="url"
                id="avatar-link"
                name="avatar-link"
                class="modal__input"
                placeholder="Paste the link to an image"
                required
              />
              <span id="avatar-link-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>

      <div
        id="delete-modal"
        class="modal"
        role="dialog"
        aria-labelledby="delete-modal-title"
      >
        <div class="modal__container modal__container_delete-card">
          <button
            type="button"
            class="modal__close-button modal__close-button_delete-card"
          >
            <img
              src="<%=require('./images/preview-modal-close-icon.svg')%>"
              alt="Close modal"
              class="modal__close-button-icon"
            />
          </button>
          <h2
            id="delete-modal-title"
            class="modal__title modal__title_delete-card"
          >
            Are you sure you want to delete this image?
          </h2>
          <form id="delete-form" class="modal__form" novalidate>
            <div class="modal__button-container">
              <button
                type="submit"
                class="modal__submit-button modal__submit-button_type_delete-card"
              >
                Delete
              </button>
              <button
                type="button"
                class="modal__submit-button modal__submit-button_type_cancel"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
